name: Import approved edit

on:
  pull_request_review:
    types: [submitted]

jobs:
  import:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Require the import token
        id: token
        env:
          BLOG_IMPORT_TOKEN: ${{ secrets.BLOG_IMPORT_TOKEN }}
        run: |
          if [ -z "$BLOG_IMPORT_TOKEN" ]; then
            echo "BLOG_IMPORT_TOKEN is not set. An approved edit cannot open a product pull request until that secret exists."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: nsakenov/scaledpapers
          token: ${{ secrets.BLOG_IMPORT_TOKEN }}
          ref: master
          path: product

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: edit

      - name: Open the product pull request
        working-directory: product
        env:
          GH_TOKEN: ${{ secrets.BLOG_IMPORT_TOKEN }}
          PUBLIC_PR: ${{ github.event.pull_request.number }}
          WORKDIR: ${{ github.workspace }}/product
          EDIT_DIR: ${{ github.workspace }}/edit
        run: node scripts/import-blog-edit.mjs
